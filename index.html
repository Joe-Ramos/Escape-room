<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Room - Game Master</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px 15px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    #timer {
      font-size: 90px;
      font-weight: bold;
      margin: 30px 0;
    }

    button {
      font-size: 22px;
      padding: 15px 22px;
      margin: 7px;
      border-radius: 8px;
      border: none;
    }

    .section {
      margin: 20px 0;
    }
  </style>
</head>

<body>

  <h1>GAME MASTER</h1>

  <div id="timer">60:00</div>

  <div class="section">
    <button onclick="startTimer()">▶ START</button>
    <button onclick="pauseTimer()">⏸ PAUSE</button>
    <button onclick="resetTimer()">🔄 RESET</button>
  </div>

  <div class="section">
    <button onclick="sendMessage('💡 HINT AVAILABLE')">
      💡 HINT
    </button>

    <button onclick="sendMessage('⚠️ SECURITY ALERT!')">
      ⚠️ SECURITY ALERT
    </button>

    <button onclick="sendMessage('')">
      CLEAR MESSAGE
    </button>
  </div>

  <div class="section">
    <button onclick="addTime(300)">+5 MIN</button>
    <button onclick="addTime(-300)">−5 MIN</button>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCUyd2Dj6YyBs7pMbUgDQj2HTIyHxOfs90",
      authDomain: "escape-room-33c9e.firebaseapp.com",
      databaseURL: "https://escape-room-33c9e-default-rtdb.firebaseio.com",
      projectId: "escape-room-33c9e",
      storageBucket: "escape-room-33c9e.firebasestorage.app",
      messagingSenderId: "337570398197",
      appId: "1:337570398197:web:f9ef13388697f9b446aabc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const gameRef = ref(db, "game");
    const messageRef = ref(db, "message");

    let timeLeft = 3600;
    let timerRunning = false;
    let timer = null;

    function updateDisplay() {

      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;

      document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    }

    function saveGame() {

      set(gameRef, {
        timeLeft: timeLeft,
        running: timerRunning
      });
    }

    window.startTimer = function() {

      if (timerRunning) return;

      timerRunning = true;
      saveGame();

      timer = setInterval(() => {

        if (timeLeft > 0) {

          timeLeft--;
          updateDisplay();
          saveGame();

        } else {

          pauseTimer();

        }

      }, 1000);
    };

    window.pauseTimer = function() {

      clearInterval(timer);
      timerRunning = false;
      saveGame();
    };

    window.resetTimer = function() {

      clearInterval(timer);

      timerRunning = false;
      timeLeft = 3600;

      updateDisplay();
      saveGame();
    };

    window.sendMessage = function(message) {

      set(messageRef, message);

    };

    window.addTime = function(amount) {

      timeLeft += amount;

      if (timeLeft < 0) {
        timeLeft = 0;
      }

      updateDisplay();
      saveGame();
    };

    onValue(gameRef, (snapshot) => {

      const data = snapshot.val();

      if (!data) return;

      timeLeft = data.timeLeft ?? 3600;
      timerRunning = data.running ?? false;

      updateDisplay();

    });

    updateDisplay();

  </script>

</body>
</html>
