<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Room</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 30px;
    }

    #timer {
      font-size: 100px;
      font-weight: bold;
      margin: 40px 0;
    }

    button {
      font-size: 24px;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>ESCAPE ROOM</h1>

  <div id="timer">60:00</div>

  <button onclick="startTimer()">START</button>
  <button onclick="pauseTimer()">PAUSE</button>
  <button onclick="resetTimer()">RESET</button>

  <script>
    let timeLeft = 60 * 60;
    let timerRunning = false;
    let timer;

    function updateDisplay() {
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;

      document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    }

    function startTimer() {
      if (timerRunning) return;

      timerRunning = true;

      timer = setInterval(function() {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timer);
          timerRunning = false;
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      timerRunning = false;
    }

    function resetTimer() {
      clearInterval(timer);
      timerRunning = false;
      timeLeft = 60 * 60;
      updateDisplay();
    }

    updateDisplay();
  </script>

</body>
</html>
