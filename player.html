<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Room</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 45px;
      margin: 0 0 30px 0;
    }

    #timer {
      font-size: 120px;
      font-weight: bold;
    }

    #message {
      font-size: 32px;
      margin: 40px 20px 0 20px;
      min-height: 50px;
    }
  </style>
</head>

<body>

  <h1>ESCAPE ROOM</h1>

  <div id="timer">60:00</div>

  <div id="message"></div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCUyd2Dj6YyBs7pMbUgDQj2HTIyHxOfs90",
      authDomain: "escape-room-33c9e.firebaseapp.com",
      databaseURL: "https://escape-room-33c9e-default-rtdb.firebaseio.com",
      projectId: "escape-room-33c9e",
      storageBucket: "escape-room-33c9e.firebasestorage.app",
      messagingSenderId: "337570398197",
      appId: "1:337570398197:web:f9ef13388697f9b446aabc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const gameRef = ref(db, "game");
    const messageRef = ref(db, "message");

    // Update timer
    onValue(gameRef, (snapshot) => {

      const data = snapshot.val();

      if (!data) return;

      const timeLeft = data.timeLeft ?? 3600;

      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;

      document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    });

    // Update message
    onValue(messageRef, (snapshot) => {

      const message = snapshot.val() || "";

      document.getElementById("message").textContent = message;

    });

  </script>

</body>
</html>
