<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Security System</title>

  <style>
    body {
      background: #0b0d0f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .system {
      width: 90%;
      max-width: 900px;
      border: 3px solid #555;
      padding: 35px 20px;
      box-sizing: border-box;
      background: #15181b;
    }

    .header {
      font-size: 24px;
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    .status {
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    #timer {
      font-family: monospace;
      font-size: clamp(80px, 18vw, 180px);
      font-weight: bold;
      letter-spacing: 5px;
      margin: 20px 0 40px 0;

      transition: transform 0.3s, text-shadow 0.3s;
    }

    #message {
      font-size: clamp(28px, 5vw, 55px);
      font-weight: bold;
      min-height: 70px;
      padding: 20px;
      box-sizing: border-box;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* --------------------------------
       10 MINUTE WARNING
       -------------------------------- */

    body.warning .system {
      border-width: 5px;
    }

    body.warning #timer {
      transform: scale(1.08);
      text-shadow: 0 0 15px white;
    }

    /* --------------------------------
       5 MINUTE WARNING
       -------------------------------- */

    body.danger #timer {
      animation: slowPulse 2s infinite;
      transform: scale(1.08);
    }

    @keyframes slowPulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.55;
      }

      100% {
        opacity: 1;
      }
    }

    /* --------------------------------
       1 MINUTE WARNING
       -------------------------------- */

    body.critical #timer {
      animation: fastPulse 0.7s infinite;
      transform: scale(1.1);
    }

    @keyframes fastPulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }

      100% {
        opacity: 1;
      }
    }

    /* --------------------------------
       SECURITY ALERT
       -------------------------------- */

    #message.security-alert {
      animation: alertPulse 0.8s infinite;
    }

    @keyframes alertPulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }

      100% {
        opacity: 1;
      }
    }

    /* --------------------------------
       TIME EXPIRED
       -------------------------------- */

    body.expired #timer {
      display: none;
    }

    body.expired #message {
      font-size: clamp(45px, 9vw, 100px);
      min-height: 150px;
      animation: expiredPulse 1s infinite;
    }

    @keyframes expiredPulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        opacity: 1;
      }
    }

  </style>
</head>

<body>

  <div class="system">

    <div class="header">
      BANK SECURITY SYSTEM
    </div>

    <div class="status">
      SECURE CONNECTION ESTABLISHED
    </div>

    <div id="timer">
      60:00
    </div>

    <div id="message"></div>

    <div class="footer">
      AUTHORIZED PERSONNEL ONLY
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyCUyd2Dj6YyBs7pMbUgDQj2HTIyHxOfs90",

      authDomain:
        "escape-room-33c9e.firebaseapp.com",

      databaseURL:
        "https://escape-room-33c9e-default-rtdb.firebaseio.com",

      projectId:
        "escape-room-33c9e",

      storageBucket:
        "escape-room-33c9e.firebasestorage.app",

      messagingSenderId:
        "337570398197",

      appId:
        "1:337570398197:web:f9ef13388697f9b446aabc"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const gameRef = ref(db, "game");
    const messageRef = ref(db, "message");


    /* TIMER */

    onValue(gameRef, (snapshot) => {

      const data = snapshot.val();

      if (!data) return;

      const timeLeft =
        data.timeLeft ?? 3600;


      const minutes =
        Math.floor(timeLeft / 60);

      const seconds =
        timeLeft % 60;


      document.getElementById("timer")
        .textContent =
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0");


      /*
        Remove previous warning states
      */

      document.body.classList.remove(
        "warning",
        "danger",
        "critical",
        "expired"
      );


      /*
        Determine warning level
      */

      if (timeLeft <= 0) {

        document.body.classList.add("expired");

        document.getElementById("message")
          .textContent = "TIME EXPIRED";

      }

      else if (timeLeft <= 60) {

        document.body.classList.add("critical");

      }

      else if (timeLeft <= 300) {

        document.body.classList.add("danger");

      }

      else if (timeLeft <= 600) {

        document.body.classList.add("warning");

      }

    });


    /* MESSAGES */

    onValue(messageRef, (snapshot) => {

      const message =
        snapshot.val() || "";

      const messageElement =
        document.getElementById("message");


      /*
        Don't overwrite TIME EXPIRED
      */

      if (
        document.body.classList.contains("expired")
      ) {
        return;
      }


      messageElement.textContent =
        message;


      /*
        Security alerts pulse
      */

      if (
        message
          .toUpperCase()
          .includes("SECURITY ALERT")
      ) {

        messageElement.classList.add(
          "security-alert"
        );

      }

      else {

        messageElement.classList.remove(
          "security-alert"
        );

      }

    });

  </script>

</body>
</html>
